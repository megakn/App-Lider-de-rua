<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Líder de Rua · SVC-SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F7; --surface:#FFFFFF; --surface-alt:#F6F8FB; --border:#D9E0EA;
    --navy-900:#0E2A47; --navy-700:#1E3A5F; --muted:#65748A; --teal-600:#0E7C86;
    --amber-500:#F5A524; --red-600:#DC2626; --purple-600:#a855f7; --slate-400:#94A3B8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy-900);font-family:'Inter',Segoe UI,Arial,sans-serif;padding-bottom:40px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 60px;}

  /* ===== Tela de entrada ===== */
  #entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(14,42,71,.10);}
  .box h1{font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
  .box p.hint{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-700);margin-bottom:6px;}
  .campo input{width:100%;padding:13px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-alt);font-family:inherit;}
  .rua-opcoes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .rua-opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-alt);font-weight:700;font-size:14.5px;color:var(--navy-900);cursor:pointer;}
  .rua-opt.selecionada{border-color:var(--teal-600);background:#F0FBFC;color:var(--teal-600);}
  #btnEntrar{width:100%;padding:14px;font-size:15px;font-weight:800;border:none;border-radius:10px;background:var(--navy-900);color:#fff;margin-top:8px;cursor:pointer;}
  #btnEntrar:disabled{background:var(--slate-400);cursor:not-allowed;}
  #erroEntrada{color:var(--red-600);font-size:12.5px;margin-top:8px;min-height:16px;}

  /* ===== Header app ===== */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:5;}
  header .titulo{font-size:16px;font-weight:800;letter-spacing:.01em;}
  header .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  header button.trocar{background:var(--surface);border:1px solid var(--border);color:var(--navy-700);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:20px;}

  .kpis-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
  .kpi-mini{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;}
  .kpi-mini .n{font-family:'Roboto Mono',monospace;font-size:17px;font-weight:700;}
  .kpi-mini .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px;}
  .card h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-700);margin:0 0 10px;font-weight:800;}
  .empty{color:var(--muted);font-size:13px;}

  /* ===== Vagas grid ===== */
  .vagas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;}
  .vaga-chip{position:relative;border-radius:9px;padding:8px 4px 7px;text-align:center;font-family:'Roboto Mono',monospace;border:1.5px solid rgba(0,0,0,.08);cursor:pointer;}
  .vaga-chip.selecionada{outline:3px solid var(--navy-900);outline-offset:1px;}
  .vaga-chip .num{font-size:14px;font-weight:800;line-height:1;}
  .vaga-chip .sigla{font-size:8px;font-weight:700;opacity:.9;margin-top:2px;display:block;}
  .vaga-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;}

  .painel-acao{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--border);}
  .painel-acao .titulo-vaga{font-weight:800;font-size:15px;margin-bottom:2px;}
  .painel-acao .info-vaga{color:var(--muted);font-size:12.5px;margin-bottom:12px;}
  .acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-acao{padding:13px 8px;border-radius:10px;border:none;font-weight:800;font-size:12.5px;color:#fff;cursor:pointer;text-align:center;line-height:1.25;}
  .btn-acao.chegou{background:var(--navy-900);}
  .btn-acao.aduana{background:var(--purple-600);}
  .btn-acao.problema{background:var(--red-600);}
  .btn-acao.separacao{background:var(--amber-500);color:#2b2400;}
  .btn-acao.finalizar{background:var(--teal-600);grid-column:1 / -1;}
  .status-atual{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:2px;}
  .status-atual .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;}
  #statusAcao{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;}
  .rota-select-wrap{margin:12px 0 10px;}
  .rota-select-wrap label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-700);margin-bottom:6px;}
  .rota-select{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-alt);font:700 13px 'Roboto Mono',monospace;color:var(--navy-900);}
  .rota-ativa-box{margin:12px 0 10px;padding:12px;border-radius:10px;background:#F0FDF4;border:1px solid #BBF7D0;}
  .rota-ativa-box.aduana{background:#FAF5FF;border-color:#E9D5FF;}
  .rota-ativa-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rota-ativa-top b{font:800 15px 'Roboto Mono',monospace;}
  .cronometro{font:800 18px 'Roboto Mono',monospace;color:#166534;}
  .rota-ativa-box.aduana .cronometro{color:#7E22CE;}
  .meta-processo{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45;}
  .limite-note{font-size:11px;color:var(--muted);margin-top:6px;}
  .btn-acao.rota{background:#16A34A;grid-column:1 / -1;}
  .btn-acao:disabled{opacity:.45;cursor:not-allowed;}

  /* ===== Resumo por onda (reaproveitado, mesma lógica do painel principal) ===== */
  .onda-colunas{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:0;padding-bottom:4px;}
  .onda-col{flex:0 0 auto;padding:0 14px;}
  .onda-col:first-of-type{padding-left:0;}
  .onda-col:not(:first-of-type){border-left:1.5px dashed var(--border);}
  .onda-title{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-900);background:#fff;display:inline-block;padding:3px 8px;border-radius:20px;border:1px solid var(--border);margin-bottom:6px;}
  .onda-title .qtd{color:var(--teal-600);font-weight:700;font-size:10px;text-transform:none;letter-spacing:0;}
  .resumo-transp-block{padding:9px 0;border-top:1px dashed var(--border);}
  .resumo-transp-block:first-of-type{border-top:none;padding-top:0;}
  .resumo-transp-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;}
  .sigla-badge-sm{font-family:'Roboto Mono',monospace;font-weight:800;font-size:10px;padding:3px 6px;border-radius:5px;}
  .resumo-transp-head .qtd{color:var(--muted);font-size:11px;}
  .resumo-table{width:auto;font-size:11.5px;margin-top:5px;border-collapse:collapse;}
  .resumo-table th,.resumo-table td{padding:3px 12px 3px 0;white-space:nowrap;text-align:left;}
  .resumo-table th{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;}
  .resumo-table td.rota{font-family:'Roboto Mono',monospace;font-weight:700;}
  .resumo-table td.parada{color:var(--teal-600);font-weight:700;}

  .ciclo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:12px;}
  .ciclo-bar label{font-size:10px;text-transform:uppercase;font-weight:800;color:var(--muted);letter-spacing:.05em;}
  .ciclo-bar select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-weight:800;color:var(--navy-900);background:var(--surface-alt);}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="entrada">
  <div class="box">
    <h1>Líder de Rua · SVC-SD</h1>
    <p class="hint">Escolha sua rua e coloque seu nome pra começar. Isso aparece na visão geral da coordenação.</p>
    <div class="campo">
      <label>Sua rua</label>
      <div class="rua-opcoes" id="ruaOpcoes"></div>
    </div>
    <div class="campo">
      <label>Seu nome</label>
      <input id="nomeInput" placeholder="Ex: Ana Paula" autocomplete="off">
    </div>
    <button id="btnEntrar" onclick="entrar()" disabled>Entrar</button>
    <div id="erroEntrada"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div>
      <div class="titulo" id="tituloRua"></div>
      <div class="sub" id="subNome"></div>
    </div>
    <button class="trocar" onclick="trocar()">Trocar</button>
  </header>

  <div class="ciclo-bar"><label>Ciclo em operação</label><select id="cicloAtivoSelect" onchange="trocarCicloAtivo(this.value)"><option>AM1</option><option>PM1</option><option>SD</option><option>CHP</option></select></div>

  <div class="kpis-mini" id="kpisMini"></div>

  <div class="card">
    <h2>Operação da vaga</h2>
    <div class="vagas-grid" id="vagasGrid"></div>
    <div class="painel-acao" id="painelAcao" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Rotas da sua rua, por onda</h2>
    <div id="resumoLider"><div class="empty">Nenhuma rota importada ainda.</div></div>
  </div>
</div>

<script>
// ================= SUPABASE =================
const SUPABASE_URL = 'https://cnpcsovjomonctbggbac.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1lqP4jYYMR96Aq8DX-DSHA_JKcGESRt';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function planDbLocal(r){
  return {
    nRota:r.rota||'', ciclo:r.ciclo||'', tipoOperacao:r.is_saca?'SACA':'ROTA',
    transportadora:(r.transportadora||'').toUpperCase(), onda:r.onda||'',
    parada:r.paradas||'', ponto:r.bairros||'', bairros:r.bairros||'',
    cluster:r.cluster||'', modal:r.modal||'', dataExp:r.data_operacao||'',
    origem:'SUPABASE'
  };
}
function opDbLocal(r){
  return {
    id:r.id, rua:r.rua, vaga:r.vaga, transportadora:r.transportadora,
    nRota:r.rota, ciclo:r.ciclo, status:r.status==='ADUANA'?'aduana':'rota_na_vaga',
    inicioVaga:new Date(r.entrada_em).getTime(), criadoEm:new Date(r.entrada_em).getTime(),
    lider:r.lider||'', aduanaEm:r.aduana_em?new Date(r.aduana_em).getTime():null
  };
}

// ================= DADOS BASE (espelha o app principal) =================
const CORES = {
  DC:{bg:'#22d3ee',fg:'#04222a'}, CM:{bg:'#22c55e',fg:'#052e12'}, OT:{bg:'#fde047',fg:'#2b2400'},
  EC:{bg:'#f3d9b1',fg:'#3a2a10'}, AL:{bg:'#0E2A47',fg:'#ffffff'}, HW:{bg:'#1e3a8a',fg:'#ffffff'},
  DL:{bg:'#3f6212',fg:'#ffffff'}, MS:{bg:'#6b7280',fg:'#ffffff'}, PC:{bg:'#f4f4f5',fg:'#111111'},
  KG:{bg:'#f97316',fg:'#2a1200'}, ME:{bg:'#f7cba4',fg:'#3a2510'}, VUC:{bg:'#ef4444',fg:'#ffffff'},
  PL:{bg:'#c4b5fd',fg:'#2e1065'}
};
const STATUS_INFO = {
  livre:{label:'Livre', hex:'#94A3B8'}, ocupado:{label:'Ocupado', hex:'#2563EB'},
  separacao:{label:'Em separação', hex:'#F5A524'}, problema:{label:'Problema', hex:'#DC2626'},
  aduana:{label:'Aduana (recontagem)', hex:'#a855f7'}
};
function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
const vagasData = [];
function addVagas(rua, nums, sigla){ nums.forEach(n=>vagasData.push({rua, num:n, sigla})); }
addVagas('Rua 1', [1,3,5,7], 'DC');
addVagas('Rua 1', [9,11,13], 'CM');
addVagas('Rua 1', [15,17,19], 'OT');
addVagas('Rua 1', [21,23], 'EC');
addVagas('Rua 1', [25,27,29,31], 'AL');
addVagas('Rua 2', [2], 'HW');
addVagas('Rua 2', [4,6,8,10,12], 'DL');
addVagas('Rua 2', [14,16,18,20,22,24], 'MS');
addVagas('Rua 2', [26,28,30,32,34], 'PC');
addVagas('Rua 3', [35,36,37,38,39,40,41], 'HW');
addVagas('Rua 3', [42,43,44], 'KG');
addVagas('Rua 3', range(45,65), 'ME');
addVagas('Rua 4 - Expedição VUC', range(66,88), 'VUC');
const RUAS_LIDER = ['Rua 1','Rua 2','Rua 3','Rua 4 - Expedição VUC'];
const RUA_SEM_VAGA = 'Direto no veículo (sem vaga)';

const DEFAULTS_VINCULOS = [
  {nome:'DECARGO', sigla:'DC'}, {nome:'COOPMETRO', sigla:'CM'}, {nome:'ECO EXPRESS', sigla:'EC'},
  {nome:'ALC', sigla:'AL'}, {nome:'HAWK', sigla:'HW'}, {nome:'KANGU', sigla:'KG'},
  {nome:'MELI EXTRA', sigla:'ME'}, {nome:'PARCEIRO', sigla:'PC'}, {nome:'ONTIME', sigla:'OT'},
  {nome:'DELUNA', sigla:'DL'}, {nome:'M.J SIMÕES', sigla:'MS'}, {nome:'PRALOG', sigla:'PL'}
];

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ondaOrdem(label){
  if(/sem onda/i.test(label)) return 9999;
  const m = label.match(/(\d+)/);
  return m ? parseInt(m[1],10) : 9998;
}

// ================= SESSÃO LOCAL (só deste celular) =================
let sessao = null; // {rua, nome}
const SESSAO_KEY = 'sessao-lider-rua';
let ruaEscolhida = null;

function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v!==null ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function lsSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
function temWindowStorage(){ return typeof window.storage!=='undefined' && window.storage && typeof window.storage.get==='function'; }

async function carregarSessao(){
  try{
    if(temWindowStorage()){ const r = await window.storage.get(SESSAO_KEY, false); sessao = r && r.value ? JSON.parse(r.value) : null; }
    else sessao = lsGet(SESSAO_KEY, null);
  }catch(e){ sessao = lsGet(SESSAO_KEY, null); }
}
async function salvarSessao(){
  try{ if(temWindowStorage()) await window.storage.set(SESSAO_KEY, JSON.stringify(sessao), false); }catch(e){}
  lsSet(SESSAO_KEY, sessao);
}
async function limparSessao(){
  sessao = null;
  try{ if(temWindowStorage()) await window.storage.delete(SESSAO_KEY, false); }catch(e){}
  try{ localStorage.removeItem(SESSAO_KEY); }catch(e){}
}

function popularRuaOpcoes(){
  document.getElementById('ruaOpcoes').innerHTML = RUAS_LIDER.map(r=>
    `<button type="button" class="rua-opt" onclick="escolherRua('${r}')" id="opt-${r.replace(/[^a-zA-Z0-9]/g,'_')}">${r}</button>`
  ).join('');
}
function escolherRua(r){
  ruaEscolhida = r;
  RUAS_LIDER.forEach(x=>{
    document.getElementById('opt-'+x.replace(/[^a-zA-Z0-9]/g,'_')).classList.toggle('selecionada', x===r);
  });
  validarEntrada();
}
function validarEntrada(){
  const nome = document.getElementById('nomeInput').value.trim();
  document.getElementById('btnEntrar').disabled = !(ruaEscolhida && nome);
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('nomeInput').addEventListener('input', validarEntrada);
});

async function entrar(){
  const nome = document.getElementById('nomeInput').value.trim();
  if(!ruaEscolhida || !nome) return;
  sessao = { rua: ruaEscolhida, nome };
  await salvarSessao();
  await registrarLider();
  await carregarTudoCompartilhado();
  mostrarApp();
  renderApp();
}
async function trocar(){
  await limparSessao();
  document.getElementById('app').style.display = 'none';
  document.getElementById('entrada').style.display = 'flex';
  document.getElementById('nomeInput').value = '';
  ruaEscolhida = null;
  RUAS_LIDER.forEach(x=>document.getElementById('opt-'+x.replace(/[^a-zA-Z0-9]/g,'_'))?.classList.remove('selecionada'));
  validarEntrada();
}

// ================= LÍDERES POR RUA (compartilhado com o painel principal) =================
async function registrarLider(){
  try{
    await db.from('lideres_rua').upsert({ rua: sessao.rua, nome: sessao.nome, atualizado_em: new Date().toISOString() }, { onConflict: 'rua' });
  }catch(e){ console.error('Erro ao registrar líder:', e); }
}

// ================= VÍNCULOS / ROTAS / OPERAÇÃO (compartilhado com a coordenação) =================
let vinculos = [];
const VINC_KEY = 'vinculos-transportadoras';
async function carregarVinculos(){
  try{
    if(temWindowStorage()){ const r = await window.storage.get(VINC_KEY, true); vinculos = r && r.value ? JSON.parse(r.value) : []; }
    else vinculos = lsGet(VINC_KEY, []);
  }catch(e){ vinculos = lsGet(VINC_KEY, []); }
  // Se não veio nada de nenhuma fonte, usa os vínculos padrão pra nunca ficar sem mapear as siglas.
  if(!vinculos || !vinculos.length) vinculos = DEFAULTS_VINCULOS.slice();
}
function vinculoPorTransportadora(nome){ const up=(nome||'').toUpperCase().trim(); return vinculos.find(v=>v.nome.toUpperCase()===up); }
function ruaDaSigla(sigla){ const item = vagasData.find(v=>v.sigla===sigla); return item ? item.rua : RUA_SEM_VAGA; }

let rotasData = [];
const ROTAS_KEY = 'rotas-importadas';
const CICLO_ATIVO_KEY='ciclo-ativo-lider';
let cicloAtivo=localStorage.getItem(CICLO_ATIVO_KEY)||'AM1';
function trocarCicloAtivo(c){ cicloAtivo=c; localStorage.setItem(CICLO_ATIVO_KEY,c); vagaSelecionada=null; renderApp(); }
async function carregarRotas(){
  try{
    const {data,error}=await db.from('planejamento').select('*').eq('data_operacao',hojeISO());
    if(error) throw error;
    rotasData=(data||[]).map(planDbLocal);
  }catch(e){
    console.error('Erro ao carregar planejamento do Supabase:',e);
    rotasData=[];
  }
}

// A coordenação lê exatamente esta mesma chave.
let chamadosData = [];
const CHAMADOS_KEY = 'chamados-ativos';
const HISTORICO_KEY = 'historico-rotas-vagas';
async function carregarChamados(){
  try{
    const {data,error}=await db.from('operacoes_vagas').select('*').eq('data_operacao',hojeISO()).neq('status','FINALIZADA');
    if(error) throw error;
    chamadosData=(data||[]).map(opDbLocal);
  }catch(e){
    console.error('Erro ao carregar operações do Supabase:',e);
    chamadosData=[];
  }
}
async function salvarChamados(){
  // Compatibilidade: as alterações agora são gravadas diretamente no Supabase.
  return true;
}
function chamadoAtivoNaVaga(num){
  return chamadosData.find(c=>Number(c.vaga)===Number(num) && String(c.status||'rota_na_vaga').toLowerCase()!=='finalizada');
}
function chamadoAtivoDaRota(nRota){
  return chamadosData.find(c=>String(c.nRota||'')===String(nRota||'') && String(c.status||'rota_na_vaga').toLowerCase()!=='finalizada');
}
function getStatus(num){
  const c=chamadoAtivoNaVaga(num);
  if(!c) return 'livre';
  return String(c.status||'rota_na_vaga').toLowerCase()==='aduana' ? 'aduana' : 'ocupado';
}
function inicioDaVaga(c){ return Number(c && (c.inicioVaga||c.chegouEm||c.criadoEm)) || Date.now(); }
function tempoNaVagaMs(c){ return Math.max(0, Date.now()-inicioDaVaga(c)); }
function formatarTempo(ms){
  const total=Math.floor(ms/1000), min=Math.floor(total/60), seg=total%60;
  return `${String(min).padStart(2,'0')}:${String(seg).padStart(2,'0')}`;
}
function transportadoraDaVaga(vaga){
  if(!vaga) return '';
  if(vaga.sigla==='VUC') return 'EXPEDIÇÃO / VUC';
  const vinc=vinculos.find(v=>v.sigla===vaga.sigla);
  return vinc ? vinc.nome : vaga.sigla;
}
function rotasDisponiveisParaVaga(vaga){
  if(!vaga) return [];
  const vinc=vinculos.find(v=>v.sigla===vaga.sigla);
  if(!vinc) return [];
  const nome=vinc.nome.toUpperCase().trim();
  const unicas=new Map();
  rotasData
    .filter(r=>String(r.transportadora||'').toUpperCase().trim()===nome && String(r.ciclo||'').toUpperCase()===String(cicloAtivo).toUpperCase() && String(r.tipoOperacao||'ROTA').toUpperCase()!=='SACA')
    .forEach(r=>{
      const chave=String(r.nRota||'').trim();
      if(!chave) return;
      if(!unicas.has(chave)) unicas.set(chave,r);
    });
  return [...unicas.values()]
    .filter(r=>!chamadoAtivoDaRota(r.nRota))
    .sort((a,b)=>String(a.onda||'').localeCompare(String(b.onda||''),'pt-BR',{numeric:true}) || String(a.nRota).localeCompare(String(b.nRota),'pt-BR',{numeric:true}));
}
async function iniciarRotaNaVaga(num){
  const vaga=vagasData.find(v=>v.num===Number(num));
  const sel=document.getElementById('rotaSelecionada');
  const nRota=sel?sel.value:'';
  const st=document.getElementById('statusAcao');
  if(!vaga||!nRota){if(st)st.textContent='Escolha a rota antes de confirmar a vaga.';return;}
  const rota=rotasData.find(r=>r.nRota===nRota&&String(r.ciclo).toUpperCase()===String(cicloAtivo).toUpperCase())||{};
  const {error}=await db.from('operacoes_vagas').insert({
    data_operacao:hojeISO(),ciclo:rota.ciclo||cicloAtivo,rua:vaga.rua,
    transportadora:transportadoraDaVaga(vaga),rota:nRota,vaga:vaga.num,
    lider:sessao?sessao.nome:'',status:'NA_VAGA',entrada_em:new Date().toISOString()
  });
  if(error){if(st)st.textContent='Não foi possível colocar a rota na vaga: '+error.message;return;}
  await carregarSupabaseLider();
  if(st)st.textContent=`Rota ${nRota} confirmada na vaga ${num}. Cronômetro iniciado.`;
}
async function marcarAduana(num){
  const c=chamadoAtivoNaVaga(num),st=document.getElementById('statusAcao');
  if(!c){if(st)st.textContent='Primeiro confirme a rota nesta vaga.';return;}
  const {error}=await db.from('operacoes_vagas').update({status:'ADUANA',aduana_em:new Date().toISOString()}).eq('id',c.id);
  if(error){if(st)st.textContent='Erro ao marcar Aduana: '+error.message;return;}
  await carregarSupabaseLider();
}
async function finalizarVaga(num){
  const c=chamadoAtivoNaVaga(num),st=document.getElementById('statusAcao');
  if(!c){if(st)st.textContent='Esta vaga já está livre.';return;}
  const {error}=await db.from('operacoes_vagas').update({status:'FINALIZADA',finalizada_em:new Date().toISOString()}).eq('id',c.id);
  if(error){if(st)st.textContent='Erro ao finalizar: '+error.message;return;}
  vagaSelecionada=null; await carregarSupabaseLider();
}
async function carregarTudoCompartilhado(){
  await carregarVinculos();
  DEFAULTS_VINCULOS.forEach(d=>{
    if(!vinculos.some(v=>v.nome.toUpperCase()===d.nome.toUpperCase())) vinculos.push(d);
  });
  await carregarRotas();
  await carregarChamados();
}

// ================= UI: VAGAS DA RUA =================
let vagaSelecionada = null;
function selecionarVaga(num){
  vagaSelecionada = (vagaSelecionada===num) ? null : num;
  renderVagasGrid();
  renderPainelAcao();
}
function renderVagasGrid(){
  const vagas = vagasData.filter(v=>v.rua===sessao.rua);
  const el = document.getElementById('vagasGrid');
  el.innerHTML = vagas.map(v=>{
    const cor = CORES[v.sigla];
    const st = getStatus(v.num);
    const info = STATUS_INFO[st];
    const sel = v.num===vagaSelecionada ? 'selecionada' : '';
    const ativo=chamadoAtivoNaVaga(v.num);
    const extra=ativo ? `<span style="display:block;font-size:7px;font-weight:800;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ativo.nRota||'')}</span><span style="display:block;font-size:8px;font-weight:800;margin-top:1px">${formatarTempo(tempoNaVagaMs(ativo))}</span>` : '';
    return `<div class="vaga-chip ${sel}" style="background:${cor.bg};color:${cor.fg}" onclick="selecionarVaga(${v.num})">
      <span class="vaga-dot" style="background:${info.hex}"></span>
      <span class="num">${v.num}</span><span class="sigla">${v.sigla}</span>${extra}
    </div>`;
  }).join('');
}
function renderPainelAcao(){
  const el = document.getElementById('painelAcao');
  if(vagaSelecionada===null){ el.style.display='none'; el.innerHTML=''; return; }
  const vaga = vagasData.find(v=>v.num===vagaSelecionada);
  const transp=transportadoraDaVaga(vaga);
  const ativo=chamadoAtivoNaVaga(vaga.num);
  el.style.display = 'block';
  if(ativo){
    const aduana=String(ativo.status||'').toLowerCase()==='aduana';
    el.innerHTML = `
      <div class="titulo-vaga">Vaga ${vaga.num} · ${vaga.sigla}</div>
      <div class="info-vaga">${escapeHtml(transp)} · ${escapeHtml(vaga.rua)}</div>
      <div class="rota-ativa-box ${aduana?'aduana':''}">
        <div class="rota-ativa-top"><b>${escapeHtml(ativo.nRota||'—')}</b><span class="cronometro" data-cronometro-vaga="${vaga.num}">${formatarTempo(tempoNaVagaMs(ativo))}</span></div>
        <div class="meta-processo"><b>${aduana?'ADUANA':'ROTA NA VAGA'}</b><br>${ativo.onda?escapeHtml(ativo.onda)+' · ':''}${ativo.parada?escapeHtml(ativo.parada)+' paradas · ':''}Tempo total ocupando a vaga · limite operacional 30 min${ativo.bairros?`<br><span style="font-weight:600">Bairros: ${escapeHtml(ativo.bairros)}</span>`:''}</div>
      </div>
      <div class="acoes-grid">
        <button class="btn-acao aduana" onclick="marcarAduana(${vaga.num})">Aduana<br>(conferência LOG)</button>
        <button class="btn-acao finalizar" onclick="finalizarVaga(${vaga.num})">Finalizar rota — liberar vaga</button>
      </div>
      <div id="statusAcao"></div>`;
    return;
  }
  const rotas=rotasDisponiveisParaVaga(vaga);
  el.innerHTML = `
    <div class="titulo-vaga">Vaga ${vaga.num} · ${vaga.sigla}</div>
    <div class="info-vaga">${escapeHtml(transp)} · ${escapeHtml(vaga.rua)} · Vaga livre</div>
    <div class="rota-select-wrap">
      <label>Rota que chegou nesta vaga</label>
      <select id="rotaSelecionada" class="rota-select">
        <option value="">— selecione a rota —</option>
        ${rotas.map(r=>`<option value="${escapeHtml(r.nRota)}">${escapeHtml(r.nRota)} · ${escapeHtml(r.ciclo||cicloAtivo)}${r.onda?' · '+escapeHtml(r.onda):''}${r.parada?' · '+escapeHtml(r.parada)+' paradas':''}</option>`).join('')}
      </select>
      <div class="limite-note">Só aparecem rotas da transportadora desta vaga que ainda não estão ocupando outra posição.</div>
    </div>
    <div class="acoes-grid">
      <button class="btn-acao rota" onclick="iniciarRotaNaVaga(${vaga.num})" ${rotas.length?'':'disabled'}>Confirmar ROTA NA VAGA · iniciar 30 min</button>
    </div>
    <div id="statusAcao">${rotas.length?'':'Nenhuma rota disponível desta transportadora no ciclo selecionado.'}</div>`;
}
function renderKpisMini(){
  const vagas = vagasData.filter(v=>v.rua===sessao.rua);
  const ocupadas=vagas.filter(v=>!!chamadoAtivoNaVaga(v.num)).length;
  const aduana=vagas.filter(v=>{const c=chamadoAtivoNaVaga(v.num);return c&&String(c.status||'').toLowerCase()==='aduana';}).length;
  const livres=vagas.length-ocupadas;
  document.getElementById('kpisMini').innerHTML = `
    <div class="kpi-mini"><div class="n">${vagas.length}</div><div class="l">Vagas</div></div>
    <div class="kpi-mini"><div class="n">${ocupadas}</div><div class="l">Em processo</div></div>
    <div class="kpi-mini"><div class="n">${aduana}</div><div class="l">Aduana</div></div>
    <div class="kpi-mini"><div class="n">${livres}</div><div class="l">Livres</div></div>`;
}

// ================= RESUMO POR ONDA (só a rua da líder) =================
function computeResumoLider(){
  const map = {}; // sigla -> {transportadora, ondas: {ondaLabel: {nRota: Set(parada)}}}
  rotasData.forEach(r=>{
    if(String(r.ciclo||'').toUpperCase()!==String(cicloAtivo).toUpperCase() || String(r.tipoOperacao||'ROTA').toUpperCase()==='SACA') return;
    const vinc = vinculoPorTransportadora(r.transportadora);
    if(!vinc) return;
    if(ruaDaSigla(vinc.sigla) !== sessao.rua) return;
    const ondaLabel = (r.onda && r.onda.trim()) ? r.onda.trim() : 'Sem onda (saca)';
    if(!map[vinc.sigla]) map[vinc.sigla] = {transportadora:r.transportadora, ondas:{}};
    const grupo = map[vinc.sigla];
    if(!grupo.ondas[ondaLabel]) grupo.ondas[ondaLabel] = {};
    if(!grupo.ondas[ondaLabel][r.nRota]) grupo.ondas[ondaLabel][r.nRota] = new Set();
    if(r.parada) grupo.ondas[ondaLabel][r.nRota].add(r.parada);
  });
  return map;
}
function renderResumoLider(){
  const el = document.getElementById('resumoLider');
  const map = computeResumoLider();
  const siglas = Object.keys(map);
  if(!siglas.length){ el.innerHTML = '<div class="empty">Nenhuma rota importada ainda pra essa rua.</div>'; return; }
  el.innerHTML = siglas.map(sigla=>{
    const d = map[sigla];
    const ondaLabels = Object.keys(d.ondas).sort((a,b)=>ondaOrdem(a)-ondaOrdem(b));
    let totalRotas = 0;
    const colunas = ondaLabels.map(ondaLabel=>{
      const rotasObj = d.ondas[ondaLabel];
      const rotasList = Object.keys(rotasObj).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
      totalRotas += rotasList.length;
      const linhas = rotasList.map(nRota=>{
        const paradas = rotasObj[nRota];
        const paradaTxt = paradas.size ? [...paradas].join(', ') : '—';
        return `<tr><td class="rota">${escapeHtml(nRota||'—')}</td><td class="parada">${escapeHtml(paradaTxt)}</td></tr>`;
      }).join('');
      return `<div class="onda-col">
        <div class="onda-title">${escapeHtml(ondaLabel)} <span class="qtd">— ${rotasList.length} rota(s)</span></div>
        <table class="resumo-table"><thead><tr><th>Rota</th><th>Parada</th></tr></thead><tbody>${linhas}</tbody></table>
      </div>`;
    }).join('');
    const cor = CORES[sigla];
    return `<div class="resumo-transp-block">
      <div class="resumo-transp-head">
        <span class="sigla-badge-sm" style="background:${cor.bg};color:${cor.fg}">${sigla}</span>
        <b>${escapeHtml(d.transportadora)}</b>
        <span class="qtd">${totalRotas} rota(s)</span>
      </div>
      <div class="onda-colunas">${colunas}</div>
    </div>`;
  }).join('');
}

// ================= RENDER GERAL =================
function renderApp(){
  const cs=document.getElementById('cicloAtivoSelect'); if(cs) cs.value=cicloAtivo;
  document.getElementById('tituloRua').textContent = sessao.rua;
  document.getElementById('subNome').textContent = `${sessao.nome} · ${cicloAtivo}`;
  renderKpisMini();
  renderVagasGrid();
  renderPainelAcao();
  renderResumoLider();
}
function mostrarApp(){
  document.getElementById('entrada').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function init(){
  popularRuaOpcoes();
  await carregarSessao();
  if(sessao && sessao.rua && sessao.nome){
    await registrarLider();
    await carregarTudoCompartilhado();
    mostrarApp();
    renderApp();
  }
  setInterval(()=>{
    if(!sessao) return;
    document.querySelectorAll('[data-cronometro-vaga]').forEach(el=>{
      const c=chamadoAtivoNaVaga(Number(el.dataset.cronometroVaga));
      if(c) el.textContent=formatarTempo(tempoNaVagaMs(c));
    });
    renderVagasGrid();
  }, 1000);
  setInterval(async ()=>{
    if(!sessao) return;
    await carregarTudoCompartilhado();
    renderApp();
  }, 3000);
  setInterval(()=>{ if(sessao) registrarLider(); }, 5*60*1000);
}
init();
</script>
<script>
async function carregarSupabaseLider(){
  if(!sessao) return;
  await carregarTudoCompartilhado();
  renderApp();
}
function iniciarRealtimeLider(){
  db.channel('svc-lider')
    .on('postgres_changes',{event:'*',schema:'public',table:'planejamento'},()=>carregarSupabaseLider())
    .on('postgres_changes',{event:'*',schema:'public',table:'operacoes_vagas'},()=>carregarSupabaseLider())
    .subscribe();
}
document.addEventListener('DOMContentLoaded',()=>setTimeout(async()=>{await carregarSupabaseLider();iniciarRealtimeLider();},600));
</script>
