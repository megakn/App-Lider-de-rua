<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Líder de Rua · SVC-SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F7; --surface:#FFFFFF; --surface-alt:#F6F8FB; --border:#D9E0EA;
    --navy-900:#0E2A47; --navy-700:#1E3A5F; --muted:#65748A; --teal-600:#0E7C86;
    --amber-500:#F5A524; --red-600:#DC2626; --purple-600:#a855f7; --slate-400:#94A3B8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy-900);font-family:'Inter',Segoe UI,Arial,sans-serif;padding-bottom:40px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 60px;}

  /* ===== Tela de entrada ===== */
  #entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(14,42,71,.10);}
  .box h1{font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
  .box p.hint{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-700);margin-bottom:6px;}
  .campo input{width:100%;padding:13px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-alt);font-family:inherit;}
  .rua-opcoes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .rua-opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-alt);font-weight:700;font-size:14.5px;color:var(--navy-900);cursor:pointer;}
  .rua-opt.selecionada{border-color:var(--teal-600);background:#F0FBFC;color:var(--teal-600);}
  #btnEntrar{width:100%;padding:14px;font-size:15px;font-weight:800;border:none;border-radius:10px;background:var(--navy-900);color:#fff;margin-top:8px;cursor:pointer;}
  #btnEntrar:disabled{background:var(--slate-400);cursor:not-allowed;}
  #erroEntrada{color:var(--red-600);font-size:12.5px;margin-top:8px;min-height:16px;}

  /* ===== Header app ===== */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:5;}
  header .titulo{font-size:16px;font-weight:800;letter-spacing:.01em;}
  header .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  header button.trocar{background:var(--surface);border:1px solid var(--border);color:var(--navy-700);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:20px;}

  .kpis-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
  .kpi-mini{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;}
  .kpi-mini .n{font-family:'Roboto Mono',monospace;font-size:17px;font-weight:700;}
  .kpi-mini .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px;}
  .card h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-700);margin:0 0 10px;font-weight:800;}
  .empty{color:var(--muted);font-size:13px;}

  /* ===== Vagas grid ===== */
  .vagas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;}
  .vaga-chip{position:relative;border-radius:9px;padding:8px 4px 7px;text-align:center;font-family:'Roboto Mono',monospace;border:1.5px solid rgba(0,0,0,.08);cursor:pointer;}
  .vaga-chip.selecionada{outline:3px solid var(--navy-900);outline-offset:1px;}
  .vaga-chip .num{font-size:14px;font-weight:800;line-height:1;}
  .vaga-chip .sigla{font-size:8px;font-weight:700;opacity:.9;margin-top:2px;display:block;}
  .vaga-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;}

  .painel-acao{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--border);}
  .painel-acao .titulo-vaga{font-weight:800;font-size:15px;margin-bottom:2px;}
  .painel-acao .info-vaga{color:var(--muted);font-size:12.5px;margin-bottom:12px;}
  .acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-acao{padding:13px 8px;border-radius:10px;border:none;font-weight:800;font-size:12.5px;color:#fff;cursor:pointer;text-align:center;line-height:1.25;}
  .btn-acao.chegou{background:var(--navy-900);}
  .btn-acao.aduana{background:var(--purple-600);}
  .btn-acao.problema{background:var(--red-600);}
  .btn-acao.separacao{background:var(--amber-500);color:#2b2400;}
  .btn-acao.finalizar{background:var(--teal-600);grid-column:1 / -1;}
  .status-atual{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:2px;}
  .status-atual .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;}
  #statusAcao{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;}

  /* ===== Resumo por onda (reaproveitado, mesma lógica do painel principal) ===== */
  .onda-colunas{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:0;padding-bottom:4px;}
  .onda-col{flex:0 0 auto;padding:0 14px;}
  .onda-col:first-of-type{padding-left:0;}
  .onda-col:not(:first-of-type){border-left:1.5px dashed var(--border);}
  .onda-title{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-900);background:#fff;display:inline-block;padding:3px 8px;border-radius:20px;border:1px solid var(--border);margin-bottom:6px;}
  .onda-title .qtd{color:var(--teal-600);font-weight:700;font-size:10px;text-transform:none;letter-spacing:0;}
  .resumo-transp-block{padding:9px 0;border-top:1px dashed var(--border);}
  .resumo-transp-block:first-of-type{border-top:none;padding-top:0;}
  .resumo-transp-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;}
  .sigla-badge-sm{font-family:'Roboto Mono',monospace;font-weight:800;font-size:10px;padding:3px 6px;border-radius:5px;}
  .resumo-transp-head .qtd{color:var(--muted);font-size:11px;}
  .resumo-table{width:auto;font-size:11.5px;margin-top:5px;border-collapse:collapse;}
  .resumo-table th,.resumo-table td{padding:3px 12px 3px 0;white-space:nowrap;text-align:left;}
  .resumo-table th{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;}
  .resumo-table td.rota{font-family:'Roboto Mono',monospace;font-weight:700;}
  .resumo-table td.parada{color:var(--teal-600);font-weight:700;}
</style>
</head>
<body>

<div id="entrada">
  <div class="box">
    <h1>Líder de Rua · SVC-SD</h1>
    <p class="hint">Escolha sua rua e coloque seu nome pra começar. Isso aparece na visão geral da coordenação.</p>
    <div class="campo">
      <label>Sua rua</label>
      <div class="rua-opcoes" id="ruaOpcoes"></div>
    </div>
    <div class="campo">
      <label>Seu nome</label>
      <input id="nomeInput" placeholder="Ex: Ana Paula" autocomplete="off">
    </div>
    <button id="btnEntrar" onclick="entrar()" disabled>Entrar</button>
    <div id="erroEntrada"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div>
      <div class="titulo" id="tituloRua"></div>
      <div class="sub" id="subNome"></div>
    </div>
    <button class="trocar" onclick="trocar()">Trocar</button>
  </header>

  <div class="kpis-mini" id="kpisMini"></div>

  <div class="card">
    <h2>Marcar vaga</h2>
    <div class="vagas-grid" id="vagasGrid"></div>
    <div class="painel-acao" id="painelAcao" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Rotas da sua rua, por onda</h2>
    <div id="resumoLider"><div class="empty">Nenhuma rota importada ainda.</div></div>
  </div>
</div>

<script>
// ================= DADOS BASE (espelha o app principal) =================
const CORES = {
  DC:{bg:'#22d3ee',fg:'#04222a'}, CM:{bg:'#22c55e',fg:'#052e12'}, OT:{bg:'#fde047',fg:'#2b2400'},
  EC:{bg:'#f3d9b1',fg:'#3a2a10'}, AL:{bg:'#0E2A47',fg:'#ffffff'}, HW:{bg:'#1e3a8a',fg:'#ffffff'},
  DL:{bg:'#3f6212',fg:'#ffffff'}, MS:{bg:'#6b7280',fg:'#ffffff'}, PC:{bg:'#f4f4f5',fg:'#111111'},
  KG:{bg:'#f97316',fg:'#2a1200'}, ME:{bg:'#f7cba4',fg:'#3a2510'}, VUC:{bg:'#ef4444',fg:'#ffffff'},
  PL:{bg:'#c4b5fd',fg:'#2e1065'}
};
const STATUS_INFO = {
  livre:{label:'Livre', hex:'#94A3B8'}, ocupado:{label:'Ocupado', hex:'#2563EB'},
  separacao:{label:'Em separação', hex:'#F5A524'}, problema:{label:'Problema', hex:'#DC2626'},
  aduana:{label:'Aduana (recontagem)', hex:'#a855f7'}
};
function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}
const vagasData = [];
function addVagas(rua, nums, sigla){ nums.forEach(n=>vagasData.push({rua, num:n, sigla})); }
addVagas('Rua 1', [1,3,5,7], 'DC');
addVagas('Rua 1', [9,11,13], 'CM');
addVagas('Rua 1', [15,17,19], 'OT');
addVagas('Rua 1', [21,23], 'EC');
addVagas('Rua 1', [25,27,29,31], 'AL');
addVagas('Rua 2', [2], 'HW');
addVagas('Rua 2', [4,6,8,10,12], 'DL');
addVagas('Rua 2', [14,16,18,20,22,24], 'MS');
addVagas('Rua 2', [26,28,30,32,34], 'PC');
addVagas('Rua 3', [35,36,37,38,39,40,41], 'HW');
addVagas('Rua 3', [42,43,44], 'KG');
addVagas('Rua 3', range(45,65), 'ME');
addVagas('Rua 4 - Expedição VUC', range(66,88), 'VUC');
const RUAS_LIDER = ['Rua 1','Rua 2','Rua 3','Rua 4 - Expedição VUC'];
const RUA_SEM_VAGA = 'Direto no veículo (sem vaga)';

const DEFAULTS_VINCULOS = [
  {nome:'DECARGO', sigla:'DC'}, {nome:'COOPMETRO', sigla:'CM'}, {nome:'ECO EXPRESS', sigla:'EC'},
  {nome:'ALC', sigla:'AL'}, {nome:'HAWK', sigla:'HW'}, {nome:'KANGU', sigla:'KG'},
  {nome:'MELI EXTRA', sigla:'ME'}, {nome:'PARCEIRO', sigla:'PC'}, {nome:'ONTIME', sigla:'OT'},
  {nome:'DELUNA', sigla:'DL'}, {nome:'M.J SIMÕES', sigla:'MS'}, {nome:'PRALOG', sigla:'PL'}
];

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ondaOrdem(label){
  if(/sem onda/i.test(label)) return 9999;
  const m = label.match(/(\d+)/);
  return m ? parseInt(m[1],10) : 9998;
}

// ================= SESSÃO LOCAL (só deste celular) =================
let sessao = null; // {rua, nome}
const SESSAO_KEY = 'sessao-lider-rua';
let ruaEscolhida = null;

async function carregarSessao(){
  try{ const r = await window.storage.get(SESSAO_KEY, false); sessao = r && r.value ? JSON.parse(r.value) : null; }
  catch(e){ sessao = null; }
}
async function salvarSessao(){
  try{ await window.storage.set(SESSAO_KEY, JSON.stringify(sessao), false); }catch(e){}
}
async function limparSessao(){
  sessao = null;
  try{ await window.storage.delete(SESSAO_KEY, false); }catch(e){}
}

function popularRuaOpcoes(){
  document.getElementById('ruaOpcoes').innerHTML = RUAS_LIDER.map(r=>
    `<button type="button" class="rua-opt" onclick="escolherRua('${r}')" id="opt-${r.replace(/[^a-zA-Z0-9]/g,'_')}">${r}</button>`
  ).join('');
}
function escolherRua(r){
  ruaEscolhida = r;
  RUAS_LIDER.forEach(x=>{
    document.getElementById('opt-'+x.replace(/[^a-zA-Z0-9]/g,'_')).classList.toggle('selecionada', x===r);
  });
  validarEntrada();
}
function validarEntrada(){
  const nome = document.getElementById('nomeInput').value.trim();
  document.getElementById('btnEntrar').disabled = !(ruaEscolhida && nome);
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('nomeInput').addEventListener('input', validarEntrada);
});

async function entrar(){
  const nome = document.getElementById('nomeInput').value.trim();
  if(!ruaEscolhida || !nome) return;
  sessao = { rua: ruaEscolhida, nome };
  await salvarSessao();
  await registrarLider();
  mostrarApp();
}
async function trocar(){
  await limparSessao();
  document.getElementById('app').style.display = 'none';
  document.getElementById('entrada').style.display = 'flex';
  document.getElementById('nomeInput').value = '';
  ruaEscolhida = null;
  RUAS_LIDER.forEach(x=>document.getElementById('opt-'+x.replace(/[^a-zA-Z0-9]/g,'_'))?.classList.remove('selecionada'));
  validarEntrada();
}

// ================= LÍDERES POR RUA (compartilhado com o painel principal) =================
const LIDERES_KEY = 'lideres-por-rua';
async function registrarLider(){
  let lideres = {};
  try{ const r = await window.storage.get(LIDERES_KEY, true); lideres = r && r.value ? JSON.parse(r.value) : {}; }catch(e){ lideres = {}; }
  lideres[sessao.rua] = { nome: sessao.nome, atualizadoEm: Date.now() };
  try{ await window.storage.set(LIDERES_KEY, JSON.stringify(lideres), true); }catch(e){}
}

// ================= VÍNCULOS / ROTAS / STATUS (compartilhado com o painel principal) =================
let vinculos = [];
const VINC_KEY = 'vinculos-transportadoras';
async function carregarVinculos(){
  try{ const r = await window.storage.get(VINC_KEY, true); vinculos = r && r.value ? JSON.parse(r.value) : []; }
  catch(e){ vinculos = []; }
}
function vinculoPorTransportadora(nome){ const up=(nome||'').toUpperCase().trim(); return vinculos.find(v=>v.nome.toUpperCase()===up); }
function ruaDaSigla(sigla){ const item = vagasData.find(v=>v.sigla===sigla); return item ? item.rua : RUA_SEM_VAGA; }

let rotasData = [];
const ROTAS_KEY = 'rotas-importadas';
async function carregarRotas(){
  try{ const r = await window.storage.get(ROTAS_KEY, true); rotasData = r && r.value ? JSON.parse(r.value) : []; }
  catch(e){ rotasData = []; }
}

let statusOverrides = {};
const STATUS_KEY = 'status-vagas';
async function carregarStatusData(){
  try{ const r = await window.storage.get(STATUS_KEY, true); statusOverrides = r && r.value ? JSON.parse(r.value) : {}; }
  catch(e){ statusOverrides = {}; }
}
async function salvarStatusData(){ try{ await window.storage.set(STATUS_KEY, JSON.stringify(statusOverrides), true); }catch(e){} }
function getStatus(num){
  if(statusOverrides[num]) return statusOverrides[num];
  const vaga = vagasData.find(v=>v.num===num);
  if(!vaga || vaga.sigla==='VUC') return 'livre';
  const temRota = rotasData.some(r=> (vinculoPorTransportadora(r.transportadora)||{}).sigla === vaga.sigla );
  return temRota ? 'ocupado' : 'livre';
}
async function setStatus(num, status){
  statusOverrides[num] = status;
  await salvarStatusData();
  document.getElementById('statusAcao').textContent = `Vaga ${num} marcada como "${STATUS_INFO[status].label}".`;
  renderApp();
}
async function finalizarVaga(num){
  delete statusOverrides[num];
  await salvarStatusData();
  document.getElementById('statusAcao').textContent = `Vaga ${num} finalizada — voltou a ficar livre.`;
  vagaSelecionada = null;
  renderApp();
}

async function carregarTudoCompartilhado(){
  await carregarVinculos();
  let mudou=false;
  DEFAULTS_VINCULOS.forEach(d=>{ if(!vinculos.some(v=>v.nome.toUpperCase()===d.nome.toUpperCase())){ vinculos.push(d); mudou=true; } });
  await carregarRotas();
  await carregarStatusData();
}

// ================= UI: VAGAS DA RUA =================
let vagaSelecionada = null;
function selecionarVaga(num){
  vagaSelecionada = (vagaSelecionada===num) ? null : num;
  renderVagasGrid();
  renderPainelAcao();
}
function renderVagasGrid(){
  const vagas = vagasData.filter(v=>v.rua===sessao.rua);
  const el = document.getElementById('vagasGrid');
  el.innerHTML = vagas.map(v=>{
    const cor = CORES[v.sigla];
    const st = getStatus(v.num);
    const info = STATUS_INFO[st];
    const sel = v.num===vagaSelecionada ? 'selecionada' : '';
    return `<div class="vaga-chip ${sel}" style="background:${cor.bg};color:${cor.fg}" onclick="selecionarVaga(${v.num})">
      <span class="vaga-dot" style="background:${info.hex}"></span>
      <span class="num">${v.num}</span><span class="sigla">${v.sigla}</span>
    </div>`;
  }).join('');
}
function renderPainelAcao(){
  const el = document.getElementById('painelAcao');
  if(vagaSelecionada===null){ el.style.display='none'; el.innerHTML=''; return; }
  const vaga = vagasData.find(v=>v.num===vagaSelecionada);
  const vinc = vinculos.find(v=>v.sigla===vaga.sigla);
  const st = getStatus(vaga.num);
  const info = STATUS_INFO[st];
  el.style.display = 'block';
  el.innerHTML = `
    <div class="titulo-vaga">Vaga ${vaga.num} · ${vaga.sigla}</div>
    <div class="info-vaga">${vinc ? escapeHtml(vinc.nome) : 'Sem transportadora vinculada'}</div>
    <div class="status-atual"><span class="dot" style="background:${info.hex}"></span> Status atual: ${info.label}</div>
    <div class="acoes-grid" style="margin-top:12px;">
      <button class="btn-acao chegou" onclick="setStatus(${vaga.num},'ocupado')">Cheguei</button>
      <button class="btn-acao aduana" onclick="setStatus(${vaga.num},'aduana')">Aduana<br>(recontagem)</button>
      <button class="btn-acao separacao" onclick="setStatus(${vaga.num},'separacao')">Em separação</button>
      <button class="btn-acao problema" onclick="setStatus(${vaga.num},'problema')">Problema</button>
      <button class="btn-acao finalizar" onclick="finalizarVaga(${vaga.num})">Finalizar — liberar vaga</button>
    </div>
    <div id="statusAcao"></div>
  `;
}
function renderKpisMini(){
  const vagas = vagasData.filter(v=>v.rua===sessao.rua);
  const counts = {livre:0, ocupado:0, aduana:0, problema:0};
  vagas.forEach(v=>{ const s=getStatus(v.num); if(counts[s]===undefined) counts[s]=0; counts[s]++; });
  document.getElementById('kpisMini').innerHTML = `
    <div class="kpi-mini"><div class="n">${vagas.length}</div><div class="l">Vagas</div></div>
    <div class="kpi-mini"><div class="n">${counts.ocupado}</div><div class="l">Ocupadas</div></div>
    <div class="kpi-mini"><div class="n">${counts.aduana}</div><div class="l">Aduana</div></div>
    <div class="kpi-mini"><div class="n">${counts.livre}</div><div class="l">Livres</div></div>
  `;
}

// ================= RESUMO POR ONDA (só a rua da líder) =================
function computeResumoLider(){
  const map = {}; // sigla -> {transportadora, ondas: {ondaLabel: {nRota: Set(parada)}}}
  rotasData.forEach(r=>{
    const vinc = vinculoPorTransportadora(r.transportadora);
    if(!vinc) return;
    if(ruaDaSigla(vinc.sigla) !== sessao.rua) return;
    const ondaLabel = (r.onda && r.onda.trim()) ? r.onda.trim() : 'Sem onda (saca)';
    if(!map[vinc.sigla]) map[vinc.sigla] = {transportadora:r.transportadora, ondas:{}};
    const grupo = map[vinc.sigla];
    if(!grupo.ondas[ondaLabel]) grupo.ondas[ondaLabel] = {};
    if(!grupo.ondas[ondaLabel][r.nRota]) grupo.ondas[ondaLabel][r.nRota] = new Set();
    if(r.parada) grupo.ondas[ondaLabel][r.nRota].add(r.parada);
  });
  return map;
}
function renderResumoLider(){
  const el = document.getElementById('resumoLider');
  const map = computeResumoLider();
  const siglas = Object.keys(map);
  if(!siglas.length){ el.innerHTML = '<div class="empty">Nenhuma rota importada ainda pra essa rua.</div>'; return; }
  el.innerHTML = siglas.map(sigla=>{
    const d = map[sigla];
    const ondaLabels = Object.keys(d.ondas).sort((a,b)=>ondaOrdem(a)-ondaOrdem(b));
    let totalRotas = 0;
    const colunas = ondaLabels.map(ondaLabel=>{
      const rotasObj = d.ondas[ondaLabel];
      const rotasList = Object.keys(rotasObj).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
      totalRotas += rotasList.length;
      const linhas = rotasList.map(nRota=>{
        const paradas = rotasObj[nRota];
        const paradaTxt = paradas.size ? [...paradas].join(', ') : '—';
        return `<tr><td class="rota">${escapeHtml(nRota||'—')}</td><td class="parada">${escapeHtml(paradaTxt)}</td></tr>`;
      }).join('');
      return `<div class="onda-col">
        <div class="onda-title">${escapeHtml(ondaLabel)} <span class="qtd">— ${rotasList.length} rota(s)</span></div>
        <table class="resumo-table"><thead><tr><th>Rota</th><th>Parada</th></tr></thead><tbody>${linhas}</tbody></table>
      </div>`;
    }).join('');
    const cor = CORES[sigla];
    return `<div class="resumo-transp-block">
      <div class="resumo-transp-head">
        <span class="sigla-badge-sm" style="background:${cor.bg};color:${cor.fg}">${sigla}</span>
        <b>${escapeHtml(d.transportadora)}</b>
        <span class="qtd">${totalRotas} rota(s)</span>
      </div>
      <div class="onda-colunas">${colunas}</div>
    </div>`;
  }).join('');
}

// ================= RENDER GERAL =================
function renderApp(){
  document.getElementById('tituloRua').textContent = sessao.rua;
  document.getElementById('subNome').textContent = sessao.nome;
  renderKpisMini();
  renderVagasGrid();
  renderPainelAcao();
  renderResumoLider();
}
function mostrarApp(){
  document.getElementById('entrada').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function init(){
  popularRuaOpcoes();
  await carregarSessao();
  if(sessao && sessao.rua && sessao.nome){
    await registrarLider();
    await carregarTudoCompartilhado();
    mostrarApp();
    renderApp();
  }
  setInterval(async ()=>{
    if(!sessao) return;
    await carregarTudoCompartilhado();
    renderApp();
  }, 6000);
}
init();
</script>
